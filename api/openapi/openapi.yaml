openapi: 3.0.3
info:
  title: qPayFlow API Specification
  description: API specifications for the qPayFlow Distributed Payment Processing Platform.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: API Gateway (Edge Ingress)
  - url: http://localhost:8001
    description: Payment Service (Direct)
  - url: http://localhost:8002
    description: Account Service (Direct)

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns health status of the service or gateway.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: api-gateway

  /payments:
    post:
      summary: Initiate a payment
      description: Creates a new payment transaction with two-tier Idempotency protection and Transactional Outbox.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Unique key to prevent double charging (can also be supplied in JSON body).
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
          description: W3C distributed tracing context (00-<trace_id>-<span_id>-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment initiated successfully (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request is currently in-flight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Idempotency key reused with mismatched payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{id}:
    get:
      summary: Get payment details by ID
      description: Retrieves the current status and settlement outcome of a payment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment ID (e.g. pay_xxxxxxxx-xxxx)
      responses:
        '200':
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{id}:
    get:
      summary: Get account balance and status
      description: Retrieves the account details, current balance, and optimistic locking version.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account ID (e.g. acc_0001)
      responses:
        '200':
          description: Account details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/transfer:
    post:
      summary: Transfer funds between accounts
      description: Executes a Double-Entry transfer with Deadlock-Prevention sorted locking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Transfer completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  transaction_id:
                    type: string
                    example: pay_12345678-abcd
        '400':
          description: Insufficient balance or invalid accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reconcile/now:
    post:
      summary: Trigger manual reconciliation audit
      description: Runs immediate Double-Entry ledger audit and Three-Way reconciliation (Settlement Service).
      responses:
        '200':
          description: Audit triggered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Reconciliation audit executed

components:
  schemas:
    CreatePaymentRequest:
      type: object
      required:
        - source_account_id
        - target_account_id
        - amount
      properties:
        idempotency_key:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        source_account_id:
          type: string
          example: acc_0001
        target_account_id:
          type: string
          example: acc_0002
        amount:
          type: number
          format: double
          example: 150.0000
        currency:
          type: string
          maxLength: 3
          default: USD
          example: USD

    Payment:
      type: object
      properties:
        id:
          type: string
          example: pay_7b9b1deb-3b7d-4bad-9bdd-2b0d7b3dcb6d
        idempotency_key:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        source_account_id:
          type: string
          example: acc_0001
        target_account_id:
          type: string
          example: acc_0002
        amount:
          type: number
          format: double
          example: 150.0000
        currency:
          type: string
          example: USD
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCESS, FAILED]
          example: PENDING
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Account:
      type: object
      properties:
        id:
          type: string
          example: acc_0001
        owner_id:
          type: string
          example: owner_0001
        currency:
          type: string
          example: USD
        balance:
          type: number
          format: double
          example: 9850.0000
        version:
          type: integer
          format: int64
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TransferRequest:
      type: object
      required:
        - transaction_id
        - from_account_id
        - to_account_id
        - amount
      properties:
        transaction_id:
          type: string
          example: pay_7b9b1deb-3b7d-4bad-9bdd-2b0d7b3dcb6d
        from_account_id:
          type: string
          example: acc_0001
        to_account_id:
          type: string
          example: acc_0002
        amount:
          type: number
          format: double
          example: 150.0000
        currency:
          type: string
          example: USD
        description:
          type: string
          example: Payment pay_7b9b1deb
        lock_strategy:
          type: string
          enum: [pessimistic, redis]
          default: pessimistic

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: insufficient balance
