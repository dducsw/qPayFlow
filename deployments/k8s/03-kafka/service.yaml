apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: qpayflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: qpayflow
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: client
    - port: 9093
      targetPort: 9093
      name: controller
  selector:
    app: kafka
