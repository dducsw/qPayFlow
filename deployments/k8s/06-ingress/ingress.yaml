# ==============================================================================
# Ingress Controller Routing for qPayFlow Services
# Compatible with Traefik (k3d default), NGINX Ingress, etc.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qpayflow-ingress
  namespace: qpayflow
  labels:
    app.kubernetes.io/name: qpayflow-ingress
    app.kubernetes.io/part-of: qpayflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          # API Gateway (Root / APIs)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # Kafka UI Management
          - path: /kafka-ui
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080

          # Grafana Dashboards
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

          # Prometheus Metrics
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090

          # Jaeger Distributed Tracing
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
