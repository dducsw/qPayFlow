apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: qpayflow
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: qpayflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8000']

      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service:8001']

      - job_name: 'account-service'
        static_configs:
          - targets: ['account-service:8002']

      - job_name: 'fraud-service'
        static_configs:
          - targets: ['fraud-service:8003']

      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:8004']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: qpayflow
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: qpayflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: qpayflow
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: qpayflow
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: qpayflow
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
