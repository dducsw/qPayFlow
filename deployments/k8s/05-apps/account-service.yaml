# ==============================================================================
# Account Service (Deployment + Service)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: qpayflow
  labels:
    app: account-service
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: qpayflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
        app.kubernetes.io/name: account-service
        app.kubernetes.io/part-of: qpayflow
    spec:
      containers:
        - name: account-service
          image: qpayflow/account-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
            - containerPort: 50052
              name: grpc
          envFrom:
            - configMapRef:
                name: qpayflow-config
            - secretRef:
                name: qpayflow-secrets
          env:
            - name: PORT
              value: "8002"
            - name: GRPC_PORT
              value: "50052"
            - name: SERVICE_NAME
              value: "account-service"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "3"]
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: qpayflow
  labels:
    app: account-service
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: qpayflow
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
    - port: 50052
      targetPort: 50052
      name: grpc
  selector:
    app: account-service
