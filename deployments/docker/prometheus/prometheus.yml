global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8001']

  - job_name: 'account-service'
    static_configs:
      - targets: ['account-service:8002']

  - job_name: 'fraud-service'
    static_configs:
      - targets: ['fraud-service:8003']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8004']
